<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Heart Disease Risk Prediction System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
    <div class="auth-bg-shape auth-shape-1"></div>
    <div class="auth-bg-shape auth-shape-2"></div>

    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="auth-card glass-card p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="auth-icon mb-3">
                    <i class="bi bi-key-fill"></i>
                </div>
                <h2 class="auth-title">Forgot Password</h2>
                <p class="auth-subtitle mb-0">Enter your registered email to receive an OTP</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }} rounded-4">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST" class="auth-form">
                <div class="mb-3">
                    <label class="form-label">Registered Email</label>
                    <div class="input-group auth-input-group">
                        <span class="input-group-text"><i class="bi bi-envelope-at"></i></span>
                        <input type="email" name="email" class="form-control custom-input" placeholder="Enter registered email" required>
                    </div>
                </div>

                <button type="submit" class="btn predict-btn w-100 mt-2">
                    <i class="bi bi-send"></i> Send OTP
                </button>
            </form>

            <div class="auth-links single-link mt-4">
                <a href="{{ url_for('login') }}">Back to login</a>
            </div>
        </div>
    </div>
</body>
</html>
