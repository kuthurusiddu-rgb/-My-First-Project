<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container py-4">

    <h2 class="mb-4">Prediction Dashboard</h2>

    <!-- Filters -->
    <form method="GET" class="row mb-4">
        <div class="col-md-3">
            <select name="risk_level" class="form-control">
                <option value="">All Risk</option>
                <option value="Low Risk">Low</option>
                <option value="Moderate Risk">Moderate</option>
                <option value="High Risk">High</option>
            </select>
        </div>

        <div class="col-md-3">
            <input type="text" name="user_email" placeholder="Email" class="form-control">
        </div>

        <div class="col-md-3">
            <input type="date" name="date" class="form-control">
        </div>

        <div class="col-md-3">
            <button class="btn btn-primary w-100">Filter</button>
        </div>
    </form>

    <!-- Stats -->
    <div class="row mb-4">
        <div class="col-md-4">Total: {{ total_predictions }}</div>
        <div class="col-md-4">High Risk: {{ high_risk }}</div>
        <div class="col-md-4">Low Risk: {{ low_risk }}</div>
    </div>

    <!-- Charts -->
    <div class="row mb-4">
        <div class="col-md-6">
            <canvas id="riskChart"></canvas>
        </div>
        <div class="col-md-6">
            <canvas id="historyChart"></canvas>
        </div>
    </div>

    <!-- Table -->
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>Patient ID</th>
            <th>Email</th>
            <th>Risk</th>
            <th>Notes</th>
            <th>Date</th>
        </tr>
        </thead>

        <tbody>
        {% for row in records %}
        <tr>
            <td>{{ row.id }}</td>
            <td>{{ row.patient_id }}</td>
            <td>{{ row.user_email }}</td>
            <td>{{ row.risk_level }}</td>
            <td>{{ row.doctor_notes }}</td>
            <td>{{ row.timestamp }}</td>
        </tr>
        {% endfor %}
        </tbody>
    </table>

</div>

<script>
new Chart(document.getElementById('riskChart'), {
    type: 'pie',
    data: {
        labels: ['High','Moderate','Low'],
        datasets: [{
            data: [{{ high_risk }}, {{ moderate_risk }}, {{ low_risk }}]
        }]
    }
});

new Chart(document.getElementById('historyChart'), {
    type: 'line',
    data: {
        labels: [{% for d in chart_dates %}"{{ d }}",{% endfor %}],
        datasets: [{
            data: [{% for c in chart_counts %}{{ c }},{% endfor %}]
        }]
    }
});
</script>

</body>
</html>
