<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify OTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="auth-card glass-card p-4 p-md-5">
            <h2 class="auth-title text-center">Verify OTP</h2>
            <p class="auth-subtitle text-center mb-4">Enter the OTP sent to your registered email</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
              {% if messages %}
                {% for category, message in messages %}
                  <div class="alert alert-{{ category }} rounded-4">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">OTP Code</label>
                    <input type="text" name="otp" maxlength="6" class="form-control custom-input text-center otp-input" required>
                </div>
                <button type="submit" class="btn predict-btn w-100">Verify OTP</button>
            </form>

            <div class="auth-links single-link mt-4">
                <a href="{{ url_for('resend_reset_otp') }}">Resend OTP</a>
            </div>
        </div>
    </div>
</body>
</html>
